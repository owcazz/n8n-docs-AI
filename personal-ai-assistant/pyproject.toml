[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Personal AI Assistant powered by Claude - your second brain in your pocket"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "anthropic>=0.39.0",
    "python-telegram-bot>=21.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "todoist-api-python>=2.1.0",
    "google-api-python-client>=2.108.0",
    "google-auth-oauthlib>=1.2.0",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=0.6.0",
    "frontmatter>=3.0.0",
    "python-frontmatter>=1.1.0",
    "jinja2>=3.1.0",
    "croniter>=2.0.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
pai = "core.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
